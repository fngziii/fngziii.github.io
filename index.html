<!-- ========================================= -->
<!-- LOTTO SAFE SYSTEM (INDEXEDDB VERSION) -->
<!-- ใช้งานแทน SCRIPT เดิมทั้งหมดได้เลย -->
<!-- ========================================= -->

<script>

const DB_NAME = "LottoDB";
const STORE_NAME = "ticketsStore";
const DB_VERSION = 1;

const PRICE_PER_PAIR = 200;

const BANK_INFO = `🏦 ธนาคารออมสิน
เลขบัญชี 020-1-25404-630
ชื่อบัญชี นันท์ภสร ขอบรูป`;

let tickets = [];
let currentFilter = 'all';
let currentUnsoldTextToCopy = "";


// =========================================
// OPEN DATABASE
// =========================================

function openDB() {

    return new Promise((resolve, reject) => {

        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = function(event) {

            const db = event.target.result;

            if (!db.objectStoreNames.contains(STORE_NAME)) {

                db.createObjectStore(STORE_NAME);
            }
        };

        request.onsuccess = function() {

            resolve(request.result);
        };

        request.onerror = function() {

            reject(request.error);
        };
    });
}


// =========================================
// SAVE DATA
// =========================================

async function saveData() {

    try {

        const db = await openDB();

        const transaction =
            db.transaction(STORE_NAME, "readwrite");

        const store =
            transaction.objectStore(STORE_NAME);

        store.put(tickets, "mainTickets");

        // emergency backup
        localStorage.setItem(
            "latestBackup",
            JSON.stringify(tickets)
        );

        renderList();

    } catch (e) {

        console.error(e);

        alert("❌ บันทึกข้อมูลไม่สำเร็จ");
    }
}


// =========================================
// LOAD DATA
// =========================================

async function loadData() {

    try {

        const db = await openDB();

        const transaction =
            db.transaction(STORE_NAME, "readonly");

        const store =
            transaction.objectStore(STORE_NAME);

        const request =
            store.get("mainTickets");

        request.onsuccess = function() {

            if (request.result) {

                tickets = request.result;

                renderList();

                updateHeaderCount();

            } else {

                // fallback backup

                const backup =
                    localStorage.getItem(
                        "latestBackup"
                    );

                if (backup) {

                    tickets = JSON.parse(backup);

                    renderList();

                    updateHeaderCount();
                }
            }
        };

    } catch (e) {

        console.error(e);

        alert("❌ โหลดข้อมูลไม่สำเร็จ");
    }
}


// =========================================
// UPDATE HEADER
// =========================================

function updateHeaderCount() {

    const el =
        document.getElementById("shopTitle");

    if (el) {

        el.innerText =
            `ร้านหวย (ขาย ${tickets.length} คู่)`;
    }
}


// =========================================
// UPDATE CUSTOMER
// =========================================

function updateCustomer(index, value) {

    tickets[index].customer = value.trim();

    if (!tickets[index].customer) {

        tickets[index].isPaid = false;
    }

    saveData();
}


// =========================================
// TOGGLE PAID
// =========================================

function togglePaid(index) {

    if (!tickets[index].customer) return;

    tickets[index].isPaid =
        !tickets[index].isPaid;

    saveData();
}


// =========================================
// FILTER
// =========================================

function setFilter(filterType) {

    currentFilter = filterType;

    renderList();
}


// =========================================
// RENDER LIST
// =========================================

function renderList() {

    try {

        const listContainer =
            document.getElementById("lottoList");

        if (!listContainer) return;

        const searchInput =
            document.getElementById("searchInput");

        const searchValue =
            searchInput
            ? searchInput.value.trim().toLowerCase()
            : "";

        let sold = 0;
        let money = 0;

        let html = "";

        tickets.forEach((t, i) => {

            if (t.customer) {

                sold++;

                if (t.isPaid) {

                    money += PRICE_PER_PAIR;
                }
            }

            const num =
                String(t.number || "");

            const matchSearch =
                num.includes(searchValue) ||
                (t.customer &&
                t.customer.toLowerCase()
                .includes(searchValue));

            if (!matchSearch) return;

            if (
                currentFilter === 'empty' &&
                t.customer !== ""
            ) return;

            if (
                currentFilter === 'pending' &&
                (!t.customer || t.isPaid)
            ) return;

            if (
                currentFilter === 'paid' &&
                (!t.customer || !t.isPaid)
            ) return;

            const statusClass =
                t.customer
                ? (t.isPaid
                    ? 'status-paid'
                    : 'status-pending')
                : 'status-free';

            const first4 =
                num.substring(0, 4);

            const last2 =
                num.substring(4, 6);

            html += `
            <div class="ticket-item ${statusClass}">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <div class="lotto-num">
                        ${first4}
                        <span class="lotto-num-highlight">
                            ${last2}
                        </span>
                    </div>

                </div>

                <div class="row g-2 align-items-center">

                    <div class="col-8">

                        <input
                            class="form-control"
                            placeholder="ชื่อลูกค้า..."
                            value="${t.customer || ""}"
                            onchange="updateCustomer(${i}, this.value)"
                        >

                    </div>

                    <div class="col-4">

                        <button
                            class="btn ${t.isPaid ? 'btn-success' : 'btn-outline-primary'} w-100"
                            onclick="togglePaid(${i})"
                            ${!t.customer ? 'disabled' : ''}
                        >

                            ${t.isPaid ? 'รับแล้ว' : 'รับเงิน'}

                        </button>

                    </div>

                </div>

            </div>
            `;
        });

        listContainer.innerHTML = html;

        const soldCount =
            document.getElementById("soldCount");

        if (soldCount) {

            soldCount.innerText =
                `${sold} / ${tickets.length}`;
        }

        const moneyCount =
            document.getElementById("moneyCount");

        if (moneyCount) {

            moneyCount.innerText =
                `฿ ${money.toLocaleString()}`;
        }

    } catch (e) {

        console.error(e);
    }
}


// =========================================
// SAVE NEW NUMBERS
// =========================================

async function saveNewNumbers() {

    try {

        const textarea =
            document.getElementById(
                "rawNumbersInput"
            );

        if (!textarea) return;

        const rawText =
            textarea.value.trim();

        if (!rawText) {

            alert("กรุณาใส่เลข");

            return;
        }

        let numList =
            rawText
            .split("\n")
            .map(n => n.trim())
            .filter(
                n =>
                n.length === 6 &&
                !isNaN(n)
            );

        if (numList.length === 0) {

            alert("ไม่พบเลข 6 หลัก");

            return;
        }

        numList =
            [...new Set(numList)];

        numList.sort((a, b) => {

            const last2A =
                parseInt(a.slice(-2));

            const last2B =
                parseInt(b.slice(-2));

            return last2A - last2B;
        });

        tickets = numList.map(n => ({

            number: String(n),
            price: PRICE_PER_PAIR,
            customer: "",
            isPaid: false

        }));

        await saveData();

        updateHeaderCount();

        alert("✅ เพิ่มเลขสำเร็จ");

    } catch (e) {

        console.error(e);

        alert("❌ เพิ่มเลขไม่สำเร็จ");
    }
}


// =========================================
// BACKUP JSON
// =========================================

function downloadBackup() {

    try {

        const data =
            JSON.stringify(tickets);

        const blob =
            new Blob(
                [data],
                {
                    type: "application/json"
                }
            );

        const a =
            document.createElement("a");

        a.href =
            URL.createObjectURL(blob);

        a.download =
            `lotto_backup_${Date.now()}.json`;

        a.click();

    } catch (e) {

        console.error(e);

        alert("❌ Backup ไม่สำเร็จ");
    }
}


// =========================================
// IMPORT BACKUP
// =========================================

function importBackup(event) {

    try {

        const file =
            event.target.files[0];

        if (!file) return;

        const reader =
            new FileReader();

        reader.onload =
            async function(e) {

                try {

                    const imported =
                        JSON.parse(
                            e.target.result
                        );

                    if (
                        !Array.isArray(imported)
                    ) {

                        alert("ไฟล์ไม่ถูกต้อง");

                        return;
                    }

                    tickets = imported;

                    await saveData();

                    renderList();

                    updateHeaderCount();

                    alert(
                        "✅ กู้คืนข้อมูลสำเร็จ"
                    );

                } catch (err) {

                    console.error(err);

                    alert("❌ ไฟล์เสีย");
                }
            };

        reader.readAsText(file);

    } catch (e) {

        console.error(e);
    }
}


// =========================================
// CLEAR DATA
// =========================================

async function executeClearData() {

    const confirmDelete =
        confirm("ล้างข้อมูลทั้งหมด?");

    if (!confirmDelete) return;

    try {

        const db = await openDB();

        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const store =
            transaction.objectStore(STORE_NAME);

        store.clear();

        localStorage.removeItem(
            "latestBackup"
        );

        tickets = [];

        renderList();

        updateHeaderCount();

        alert("✅ ล้างข้อมูลสำเร็จ");

    } catch (e) {

        console.error(e);

        alert("❌ ล้างข้อมูลไม่สำเร็จ");
    }
}


// =========================================
// COPY UNSOLD
// =========================================

function copyUnsoldNumbers() {

    const unsold =
        tickets
        .filter(t => !t.customer)
        .map(t => t.number);

    const text =
`🎯 เลขว่าง (${unsold.length} ชุด)

${unsold.join("\n")}`;

    navigator.clipboard
        .writeText(text)
        .then(() => {

            alert("✅ คัดลอกแล้ว");
        });
}


// =========================================
// SHOW SUMMARY
// =========================================

function showSummary() {

    let sold = 0;
    let paid = 0;
    let pending = 0;
    let money = 0;

    tickets.forEach(t => {

        if (t.customer) {

            sold++;

            if (t.isPaid) {

                paid++;

                money += PRICE_PER_PAIR;

            } else {

                pending++;
            }
        }
    });

    alert(
`📊 สรุปยอด

ทั้งหมด: ${tickets.length}
ขายแล้ว: ${sold}
รับเงินแล้ว: ${paid}
รอโอน: ${pending}

รายได้:
฿ ${money.toLocaleString()}`
    );
}


// =========================================
// AUTO SAVE
// =========================================

window.addEventListener(
    "beforeunload",
    function() {

        saveData();
    }
);


// =========================================
// INIT
// =========================================

async function init() {

    await loadData();

    renderList();

    updateHeaderCount();
}


// =========================================
// START
// =========================================

window.onload = init;

</script>

<!-- ========================================= -->
<!-- ปุ่ม Backup / Restore -->
<!-- เอาไปวางตรงไหนใน BODY ก็ได้ -->
<!-- ========================================= -->

<button
    class="btn btn-primary"
    onclick="downloadBackup()"
>
    Backup
</button>

<input
    type="file"
    onchange="importBackup(event)"
>
