<!-- ===================================================== -->
<!-- แทน SCRIPT เดิมทั้งหมดด้วยอันนี้ -->
<!-- ใช้กับ HTML เดิมของคุณได้เลย -->
<!-- IndexedDB + Backup/Restore + Auto Save -->
<!-- ===================================================== -->

<script>

const DB_NAME = "LottoDB";
const STORE_NAME = "ticketsStore";
const DB_VERSION = 1;

const PRICE_PER_PAIR = 200;

const BANK_INFO = `🏦 ธนาคารออมสิน
เลขบัญชี 020-1-25404-630
ชื่อบัญชี นันท์ภสร ขอบรูป`;

let tickets = [];
let currentFilter = 'all';
let currentUnsoldTextToCopy = "";

let setupModalInstance;
let confirmClearModalInstance;


// =====================================================
// OPEN DATABASE
// =====================================================

function openDB() {

    return new Promise((resolve, reject) => {

        const request = indexedDB.open(
            DB_NAME,
            DB_VERSION
        );

        request.onupgradeneeded = function(event) {

            const db = event.target.result;

            if (
                !db.objectStoreNames.contains(
                    STORE_NAME
                )
            ) {

                db.createObjectStore(STORE_NAME);
            }
        };

        request.onsuccess = function() {

            resolve(request.result);
        };

        request.onerror = function() {

            reject(request.error);
        };
    });
}


// =====================================================
// SAVE DATA
// =====================================================

async function saveData() {

    try {

        const db = await openDB();

        const tx =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const store =
            tx.objectStore(STORE_NAME);

        store.put(
            tickets,
            "mainTickets"
        );

        // backup emergency
        localStorage.setItem(
            "lotto_backup",
            JSON.stringify(tickets)
        );

    } catch(e) {

        console.error(e);

        alert("❌ บันทึกข้อมูลไม่สำเร็จ");
    }
}


// =====================================================
// LOAD DATA
// =====================================================

async function loadData() {

    try {

        const db = await openDB();

        const tx =
            db.transaction(
                STORE_NAME,
                "readonly"
            );

        const store =
            tx.objectStore(STORE_NAME);

        const request =
            store.get("mainTickets");

        request.onsuccess = function() {

            if(request.result) {

                tickets = request.result;

            } else {

                // fallback local backup

                const backup =
                    localStorage.getItem(
                        "lotto_backup"
                    );

                if(backup) {

                    tickets =
                        JSON.parse(backup);
                }
            }

            updateHeaderCount();

            renderList();

            if(
                !tickets ||
                tickets.length === 0
            ) {

                setupModalInstance.show();
            }
        };

    } catch(e) {

        console.error(e);

        alert("❌ โหลดข้อมูลไม่สำเร็จ");
    }
}


// =====================================================
// INIT
// =====================================================

async function init() {

    setupModalInstance =
        new bootstrap.Modal(
            document.getElementById(
                'setupModal'
            )
        );

    confirmClearModalInstance =
        new bootstrap.Modal(
            document.getElementById(
                'confirmClearModal'
            )
        );

    document
        .getElementById(
            'rawNumbersInput'
        )
        .addEventListener(
            'input',
            updateTextareaCount
        );

    await loadData();
}


// =====================================================
// UPDATE TEXTAREA COUNT
// =====================================================

function updateTextareaCount() {

    const text =
        document.getElementById(
            'rawNumbersInput'
        ).value;

    const validNumbers =
        text
        .split('\n')
        .map(
            n =>
            n.trim()
            .replace(/\s+/g, '')
        )
        .filter(
            n =>
            n.length === 6 &&
            !isNaN(n)
        );

    const uniqueNumbers =
        [...new Set(validNumbers)];

    document.getElementById(
        'currentNumberCount'
    ).innerText =
        uniqueNumbers.length;
}


// =====================================================
// UPDATE HEADER
// =====================================================

function updateHeaderCount() {

    const title =
        document.getElementById(
            "shopTitle"
        );

    if(title) {

        title.innerText =
            `ร้านหวย (ขาย ${tickets.length} คู่)`;
    }
}


// =====================================================
// SAVE NEW NUMBERS
// =====================================================

async function saveNewNumbers() {

    try {

        const rawText =
            document.getElementById(
                'rawNumbersInput'
            )
            .value
            .trim();

        if (!rawText) {

            alert("กรุณาใส่เลข");

            return;
        }

        let numList =
            rawText
            .split('\n')
            .map(
                n =>
                n.trim()
                .replace(/\s+/g, '')
            )
            .filter(
                n =>
                n.length === 6 &&
                !isNaN(n)
            );

        if(numList.length === 0) {

            alert("ไม่พบเลข 6 หลัก");

            return;
        }

        numList =
            [...new Set(numList)];

        numList.sort((a, b) => {

            const last2A =
                parseInt(a.slice(-2));

            const last2B =
                parseInt(b.slice(-2));

            return last2A - last2B;
        });

        tickets = numList.map(n => ({

            number: String(n),
            price: PRICE_PER_PAIR,
            customer: "",
            isPaid: false

        }));

        await saveData();

        updateHeaderCount();

        renderList();

        setupModalInstance.hide();

    } catch(e) {

        console.error(e);

        alert("❌ เพิ่มเลขไม่สำเร็จ");
    }
}


// =====================================================
// FILTER
// =====================================================

function setFilter(filterType) {

    currentFilter = filterType;

    renderList();
}


// =====================================================
// RENDER LIST
// =====================================================

function renderList() {

    try {

        const searchValue =
            document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();

        const listContainer =
            document.getElementById(
                "lottoList"
            );

        let sold = 0;
        let money = 0;

        let htmlContent = '';

        tickets.forEach((t, i) => {

            if (t.customer) {

                sold++;

                if (t.isPaid) {

                    money += PRICE_PER_PAIR;
                }
            }

            const numStr =
                String(t.number || "");

            const matchSearch =
                numStr.includes(searchValue) ||
                (
                    t.customer &&
                    t.customer
                    .toLowerCase()
                    .includes(searchValue)
                );

            if (!matchSearch) return;

            if (
                currentFilter === 'empty' &&
                t.customer !== ""
            ) return;

            if (
                currentFilter === 'pending' &&
                (!t.customer || t.isPaid)
            ) return;

            if (
                currentFilter === 'paid' &&
                (!t.customer || !t.isPaid)
            ) return;

            const statusClass =
                t.customer
                ? (
                    t.isPaid
                    ? 'status-paid'
                    : 'status-pending'
                )
                : 'status-free';

            const badgeClass =
                t.customer
                ? (
                    t.isPaid
                    ? 'bg-paid-custom'
                    : 'bg-pending-custom'
                )
                : 'bg-free-custom';

            const badgeText =
                t.customer
                ? (
                    t.isPaid
                    ? 'จ่ายแล้ว'
                    : 'รอโอน'
                )
                : 'ว่าง';

            const btnClass =
                t.isPaid
                ? 'btn-success'
                : 'btn-outline-primary';

            const btnText =
                t.isPaid
                ? 'รับแล้ว'
                : 'รับเงิน';

            const first4 =
                numStr.substring(0, 4);

            const last2 =
                numStr.substring(4, 6);

            htmlContent += `
            <div class="ticket-item ${statusClass}">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <div class="lotto-num">
                        ${first4}
                        <span class="lotto-num-highlight">
                            ${last2}
                        </span>
                    </div>

                    <span class="badge badge-custom ${badgeClass}">
                        ${badgeText}
                    </span>

                </div>

                <div class="row g-2 align-items-center">

                    <div class="col-8">

                        <div class="input-group rounded-input-group">

                            <span class="input-group-text px-3">
                                👤
                            </span>

                            <input
                                class="form-control py-2 fw-bold"
                                placeholder="ชื่อลูกค้า..."
                                value="${t.customer || ""}"
                                onchange="updateCustomer(${i}, this.value)"
                            >

                        </div>

                    </div>

                    <div class="col-4">

                        <button
                            class="btn btn-pay-status w-100 ${btnClass}"
                            onclick="togglePaid(${i})"
                            ${!t.customer ? 'disabled' : ''}
                        >

                            ${btnText}

                        </button>

                    </div>

                </div>

            </div>
            `;
        });

        listContainer.innerHTML =
            htmlContent;

        document.getElementById(
            "soldCount"
        ).innerText =
            `${sold}/${tickets.length}`;

        document.getElementById(
            "moneyCount"
        ).innerText =
            `฿ ${money.toLocaleString()}`;

    } catch(e) {

        console.error(e);
    }
}


// =====================================================
// UPDATE CUSTOMER
// =====================================================

async function updateCustomer(i, value) {

    tickets[i].customer =
        value.trim();

    if(!tickets[i].customer) {

        tickets[i].isPaid = false;
    }

    await saveData();

    renderList();
}


// =====================================================
// TOGGLE PAID
// =====================================================

async function togglePaid(i) {

    if(!tickets[i].customer) return;

    tickets[i].isPaid =
        !tickets[i].isPaid;

    await saveData();

    renderList();
}


// =====================================================
// CLEAR DATA
// =====================================================

function confirmClearData() {

    confirmClearModalInstance.show();
}

async function executeClearData() {

    try {

        const db = await openDB();

        const tx =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const store =
            tx.objectStore(STORE_NAME);

        store.clear();

        localStorage.removeItem(
            "lotto_backup"
        );

        tickets = [];

        renderList();

        updateHeaderCount();

        confirmClearModalInstance.hide();

        setupModalInstance.show();

    } catch(e) {

        console.error(e);

        alert("❌ ล้างข้อมูลไม่สำเร็จ");
    }
}


// =====================================================
// SUMMARY
// =====================================================

function showSummary() {

    let sold = 0;
    let paid = 0;
    let pending = 0;
    let money = 0;

    let unsoldList = [];

    tickets.forEach(t => {

        if(t.customer) {

            sold++;

            if(t.isPaid) {

                paid++;

                money += PRICE_PER_PAIR;

            } else {

                pending++;
            }

        } else {

            unsoldList.push(t.number);
        }
    });

    let txt = `📊 สรุปยอดขาย

📦 ทั้งหมด: ${tickets.length}
🎟️ ขายแล้ว: ${sold}
✅ รับเงินแล้ว: ${paid}
⏳ รอโอน: ${pending}

💰 รายได้:
฿ ${money.toLocaleString()}

━━━━━━━━━━

🎯 เลขว่าง:
${unsoldList.join(" , ")}`;

    document.getElementById(
        "summaryText"
    ).innerText = txt;

    currentUnsoldTextToCopy =
        unsoldList.join("\n");

    new bootstrap.Modal(
        document.getElementById(
            "summaryModal"
        )
    ).show();
}


// =====================================================
// COPY UNSOLD
// =====================================================

function copyUnsoldNumbers() {

    navigator.clipboard
        .writeText(
            currentUnsoldTextToCopy
        )
        .then(() => {

            alert("✅ คัดลอกแล้ว");
        });
}


// =====================================================
// PERSON SUMMARY
// =====================================================

function showPersonSummary() {

    const names =
        [...new Set(

            tickets
            .filter(
                t =>
                t.customer &&
                !t.isPaid
            )
            .map(t => t.customer)

        )];

    const select =
        document.getElementById(
            "personSelect"
        );

    select.innerHTML =
        '<option value="">-- เลือก --</option>';

    names.forEach(n => {

        select.innerHTML +=
            `<option value="${n}">
                ${n}
            </option>`;
    });

    renderPersonSummary();

    new bootstrap.Modal(
        document.getElementById(
            "personModal"
        )
    ).show();
}


// =====================================================
// RENDER PERSON SUMMARY
// =====================================================

function renderPersonSummary() {

    const name =
        document.getElementById(
            "personSelect"
        ).value;

    const el =
        document.getElementById(
            "personSummaryText"
        );

    if(!name) {

        el.innerText =
            "เลือกลูกค้า";

        return;
    }

    const items =
        tickets.filter(
            t =>
            t.customer === name &&
            !t.isPaid
        );

    let txt =
`🧾 สรุปยอดคุณ ${name}

━━━━━━━━━━

`;

    items.forEach(i => {

        txt += `🎟️ ${i.number}\n`;
    });

    txt += `
━━━━━━━━━━

รวม ${items.length} ชุด

💰 ยอดโอน:
฿ ${(items.length * PRICE_PER_PAIR).toLocaleString()}

${BANK_INFO}
`;

    el.innerText = txt;
}


// =====================================================
// COPY PERSON SUMMARY
// =====================================================

function copyPersonSummary() {

    const text =
        document.getElementById(
            "personSummaryText"
        ).innerText;

    navigator.clipboard
        .writeText(text)
        .then(() => {

            alert("✅ คัดลอกแล้ว");
        });
}


// =====================================================
// BACKUP
// =====================================================

function downloadBackup() {

    try {

        const blob =
            new Blob(
                [JSON.stringify(tickets)],
                {
                    type: "application/json"
                }
            );

        const a =
            document.createElement("a");

        a.href =
            URL.createObjectURL(blob);

        a.download =
            `lotto_backup_${Date.now()}.json`;

        a.click();

    } catch(e) {

        console.error(e);

        alert("❌ Backup ไม่สำเร็จ");
    }
}


// =====================================================
// IMPORT BACKUP
// =====================================================

function importBackup(event) {

    try {

        const file =
            event.target.files[0];

        if(!file) return;

        const reader =
            new FileReader();

        reader.onload =
            async function(e) {

                try {

                    const imported =
                        JSON.parse(
                            e.target.result
                        );

                    if(
                        !Array.isArray(imported)
                    ) {

                        alert("ไฟล์ไม่ถูกต้อง");

                        return;
                    }

                    tickets = imported;

                    await saveData();

                    renderList();

                    updateHeaderCount();

                    alert(
                        "✅ กู้คืนสำเร็จ"
                    );

                } catch(err) {

                    console.error(err);

                    alert("❌ ไฟล์เสีย");
                }
            };

        reader.readAsText(file);

    } catch(e) {

        console.error(e);
    }
}


// =====================================================
// AUTO SAVE
// =====================================================

window.addEventListener(
    "beforeunload",
    function() {

        saveData();
    }
);


// =====================================================
// START
// =====================================================

window.onload = init;

</script>
